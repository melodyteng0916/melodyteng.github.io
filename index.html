<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Teng</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .layout {
            display: flex;
            align-items: center;
            gap: 110px;
            max-width: 960px;
            padding: 40px;
            transform: translateX(-40px);
        }
        .photo {
            width: 320px;
            height: 400px;
            border-radius: 12px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 22%;
            transform: scale(1.3);
        }
        .info {
            text-align: left;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0 0 40px 0;
            letter-spacing: -1.5px;
            line-height: 1.05;
        }
        .columns {
            display: flex;
            gap: 80px;
        }
        h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #888;
        }
        .column-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        @media (max-width: 700px) {
            .layout {
                flex-direction: column;
                gap: 32px;
                text-align: center;
            }
            .info {
                text-align: center;
            }
            h1 {
                font-size: 3rem;
            }
            .columns {
                justify-content: center;
                gap: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="photo">
            <img src="images/profile.JPG" alt="Melody Teng">
        </div>

        <div class="info">
            <h1>Melody Teng</h1>

            <div class="columns">
                <div class="column">
                    <div class="column-content">
                        <a href="mailto:melodyteng0916@gmail.com">email</a>
                        <a href="https://www.linkedin.com/in/melody-teng-/" target="_blank">linkedin</a>
                        <a href="https://github.com/melodyteng0916" target="_blank">github</a>
                        <a href="https://www.instagram.com/melodyteng_/" target="_blank">instagram</a>
                    </div>
                </div>

                <div class="column">
                    <div class="column-content">
                        <a href="work.html">work experience</a>
                        <a href="scuba.html">scuba diving</a>
                        <a href="travel.html">travel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
